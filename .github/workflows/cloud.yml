name: cloud

on:
  push:
    paths: ['apps/cloud/**', 'packages/core/src/**', '.github/workflows/cloud.yml']
  workflow_dispatch:
  pull_request:
    paths: ['apps/cloud/**', 'packages/core/src/**', '.github/workflows/cloud.yml']

defaults:
  run:
    working-directory: apps/cloud

jobs:
  test:
    name: Cloud app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/cloud/package-lock.json

      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env && php artisan key:generate
      # Typed route helpers (gitignored) that the TypeScript imports.
      - run: php artisan wayfinder:generate --with-form

      - name: Lint and types
        run: |
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          npx vp check
          npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tests
        run: php artisan test

  # The production image (apps/cloud/Dockerfile): build it, run it against MySQL, check it serves pages.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: preflight
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f apps/cloud/Dockerfile -t preflight-cloud .
      - name: Run
        run: |
          docker run -d --name app --network host \
            -e PORT=8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://127.0.0.1:8080 \
            -e DB_CONNECTION=mysql -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_DATABASE=preflight -e DB_USERNAME=root -e DB_PASSWORD= \
            preflight-cloud
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/up > /dev/null && break; sleep 2; done
          docker logs app | tail -30
          curl -fsS http://127.0.0.1:8080/ > home.html
          grep -q 'welcome' home.html
          grep -qi '<title[^>]*>[^<]*Preflight' home.html
          curl -fsS http://127.0.0.1:8080/login | grep -q 'auth/login'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/dashboard | grep -q 302
          # The OIDC-protected API refuses requests without a token.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Accept: application/json' http://127.0.0.1:8080/api/analyses)" = 401
