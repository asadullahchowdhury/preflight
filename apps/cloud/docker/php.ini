; Production PHP settings for the Preflight Cloud container.
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
