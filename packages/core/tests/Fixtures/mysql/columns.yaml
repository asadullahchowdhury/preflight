# ADD / DROP / RENAME / ALTER COLUMN. Default server 8.0.30 (verified against a real 8.0.30 by the oracle suite).

- name: add column at the end is instant
  schema: orders
  sql: alter table `orders` add `notes` varchar(255) null
  expect:
    - { rule: add-column, algorithm: INSTANT, lock: NONE, rebuild: false, severity: info }

- name: add column after another column is instant on 8.0.29+
  schema: orders
  sql: alter table `orders` add `notes` varchar(255) null after `id`
  expect:
    - { rule: add-column, algorithm: INSTANT, lock: NONE, rebuild: false, severity: info }

- name: add not-null column with default is instant
  schema: orders
  sql: alter table `orders` add `priority` varchar(10) not null default 'low'
  expect:
    - { rule: add-column, algorithm: INSTANT, lock: NONE, rebuild: false, severity: info }

- name: several columns in one statement stay instant
  schema: orders
  sql: alter table `orders` add `a` int null, add `b` json null, add `c` timestamp null
  expect:
    - { rule: add-column, algorithm: INSTANT, severity: info }
    - { rule: add-column, algorithm: INSTANT, severity: info }
    - { rule: add-column, algorithm: INSTANT, severity: info }
  statement: { algorithm: INSTANT, lock: NONE, rebuild: false }

- name: add column to a table with a FULLTEXT index copies the table
  schema: posts
  sql: alter table `posts` add `views` int null
  expect:
    - { rule: add-column, algorithm: COPY, lock: SHARED, rebuild: true, severity: danger }

- name: add stored generated column copies the table
  schema: orders
  sql: alter table `orders` add `double_qty` int as (`qty` * 2) stored
  expect:
    - { rule: add-column, algorithm: COPY, lock: SHARED, rebuild: true, severity: danger }

- name: add virtual generated column is instant
  schema: orders
  sql: alter table `orders` add `double_qty` int as (`qty` * 2) virtual
  expect:
    - { rule: add-column, algorithm: INSTANT, lock: NONE, rebuild: false, severity: info }

- name: add auto-increment column rebuilds and blocks writes
  schema: logs
  sql: alter table `logs` add `seq` int not null auto_increment, add key (`seq`)
  expect:
    - { rule: add-column, algorithm: INPLACE, lock: SHARED, rebuild: true, severity: danger }
    - { rule: add-index, algorithm: INPLACE, lock: NONE, rebuild: false, severity: warn }
  statement: { algorithm: INPLACE, lock: SHARED, rebuild: true }

- name: add column to a compressed table rebuilds in place
  schema: compressed
  sql: alter table `archive` add `flag` tinyint(1) not null default '0'
  expect:
    - { rule: add-column, algorithm: INPLACE, lock: NONE, rebuild: true, severity: warn }

- name: drop column is instant on 8.0.29+ but destructive
  schema: orders
  sql: alter table `orders` drop `note`
  expect:
    - { rule: drop-column, algorithm: INSTANT, lock: NONE, rebuild: false, severity: warn }

- name: drop indexed column rebuilds in place
  schema: orders
  sql: alter table `orders` drop column `email`
  expect:
    - { rule: drop-column, algorithm: INPLACE, lock: NONE, rebuild: true, severity: warn }

- name: rename column is instant on 8.0.28+
  schema: orders
  sql: alter table `orders` rename column `note` to `remark`
  expect:
    - { rule: rename-column, algorithm: INSTANT, lock: NONE, rebuild: false, severity: warn }

- name: set column default is instant
  schema: orders
  sql: alter table `orders` alter column `status` set default 'x'
  expect:
    - { rule: alter-column, algorithm: INSTANT, lock: NONE, rebuild: false, severity: info }

- name: drop column default is instant
  schema: orders
  sql: alter table `orders` alter `status` drop default
  expect:
    - { rule: alter-column, algorithm: INSTANT, lock: NONE, rebuild: false, severity: info }

- name: instant add column dragged into a rebuild by an index in the same statement
  schema: orders
  sql: alter table `orders` add `ref` varchar(40) null, add index `orders_ref_index`(`ref`)
  expect:
    - { rule: add-column, algorithm: INSTANT, severity: info }
    - { rule: add-index, algorithm: INPLACE, lock: NONE, rebuild: false, severity: warn }
  statement: { algorithm: INPLACE, lock: NONE, rebuild: true }
  advisories: [combined-rebuild, mdl-wait]

- name: instant drop column dragged into a rebuild by an index in the same statement
  schema: orders
  sql: alter table `orders` drop `note`, add index `orders_status_index`(`status`)
  expect:
    - { rule: drop-column, algorithm: INSTANT, severity: warn }
    - { rule: add-index, algorithm: INPLACE, severity: warn }
  statement: { algorithm: INPLACE, lock: NONE, rebuild: true }
  advisories: [combined-rebuild, mdl-wait]

- name: add column plus a type change copies the whole statement
  schema: orders
  sql: alter table `orders` add `x` int null, modify `qty` bigint not null default '0'
  expect:
    - { rule: add-column, algorithm: INSTANT, severity: info }
    - { rule: modify-column, algorithm: COPY, lock: SHARED, rebuild: true, severity: danger }
  statement: { algorithm: COPY, lock: SHARED, rebuild: true }
