- name: laravel foreign key on an existing table copies it
  schema: orders
  sql: alter table `orders` add constraint `orders_user_id_foreign` foreign key (`user_id`) references `users` (`id`) on delete cascade
  expect:
    - { rule: add-foreign-key, algorithm: COPY, lock: SHARED, rebuild: true, severity: danger }

- name: foreign key with foreign_key_checks disabled is metadata only
  schema: orders
  sql: |
    SET FOREIGN_KEY_CHECKS=0;
    alter table `orders` add constraint `orders_user_id_foreign` foreign key (`user_id`) references `users` (`id`);
    SET FOREIGN_KEY_CHECKS=1;
  expect:
    - { rule: add-foreign-key, algorithm: INPLACE, lock: NONE, rebuild: false, severity: info }

- name: foreign_key_checks from server vars
  schema: orders
  vars: { foreign_key_checks: 0 }
  sql: alter table `orders` add foreign key (`user_id`) references `users` (`id`)
  expect:
    - { rule: add-foreign-key, algorithm: INPLACE, lock: NONE, severity: info }

- name: drop foreign key is metadata only
  schema: orders
  oracle: false
  sql: alter table `orders` drop foreign key `orders_user_id_foreign`
  expect:
    - { rule: drop-foreign-key, algorithm: INPLACE, lock: NONE, rebuild: false, severity: info }

- name: check constraint copies the table
  schema: orders
  sql: alter table `orders` add constraint `orders_qty_check` check (`qty` >= 0)
  expect:
    - { rule: add-check, algorithm: COPY, lock: SHARED, rebuild: true, severity: danger }
