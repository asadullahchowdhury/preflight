- name: add index builds online
  schema: orders
  sql: alter table `orders` add index `orders_status_index`(`status`)
  expect:
    - { rule: add-index, algorithm: INPLACE, lock: NONE, rebuild: false, severity: warn }

- name: add unique index builds online
  schema: orders
  sql: alter table `orders` add unique `orders_code_unique`(`code`)
  expect:
    - { rule: add-unique-index, algorithm: INPLACE, lock: NONE, rebuild: false, severity: warn }

- name: composite index with prefix length
  schema: orders
  sql: alter table `orders` add index `orders_status_note_index`(`status`, `note`(20))
  expect:
    - { rule: add-index, algorithm: INPLACE, lock: NONE, severity: warn }

- name: create index statement builds online
  schema: orders
  sql: create index `orders_qty_index` on `orders` (`qty`)
  expect:
    - { rule: add-index, algorithm: INPLACE, lock: NONE, rebuild: false, severity: warn }

- name: first FULLTEXT index rebuilds and blocks writes
  schema: orders
  sql: alter table `orders` add fulltext `orders_body_fulltext`(`body`)
  expect:
    - { rule: add-fulltext-index, algorithm: INPLACE, lock: SHARED, rebuild: true, severity: danger }

- name: second FULLTEXT index blocks writes without rebuilding
  schema: posts
  sql: alter table `posts` add fulltext `posts_title_fulltext`(`title`)
  expect:
    - { rule: add-fulltext-index, algorithm: INPLACE, lock: SHARED, rebuild: false, severity: danger }

- name: drop index is metadata only
  schema: orders
  sql: alter table `orders` drop index `orders_email_index`
  expect:
    - { rule: drop-index, algorithm: INPLACE, lock: NONE, rebuild: false, severity: info }

- name: drop index statement is metadata only
  schema: orders
  sql: drop index `orders_email_index` on `orders`
  expect:
    - { rule: drop-index, algorithm: INPLACE, lock: NONE, rebuild: false, severity: info }

- name: rename index is metadata only
  schema: orders
  sql: alter table `orders` rename index `orders_email_index` to `orders_mail_index`
  expect:
    - { rule: rename-index, algorithm: INPLACE, lock: NONE, rebuild: false, severity: info }

- name: making an index invisible is metadata only
  schema: orders
  sql: alter table `orders` alter index `orders_email_index` invisible
  expect:
    - { rule: index-visibility, algorithm: INPLACE, lock: NONE, rebuild: false, severity: info }

- name: add primary key rebuilds in place
  schema: logs
  sql: alter table `logs` add primary key (`id`)
  expect:
    - { rule: add-primary-key, algorithm: INPLACE, lock: NONE, rebuild: true, severity: warn }

- name: dropping the primary key alone copies the table
  schema: orders
  sql: alter table `orders` modify `id` bigint unsigned not null, drop primary key
  expect:
    - { rule: modify-column, algorithm: COPY, severity: danger }
    - { rule: drop-primary-key, algorithm: COPY, lock: SHARED, rebuild: true, severity: danger }
  statement: { algorithm: COPY, lock: SHARED, rebuild: true }

- name: replacing the primary key in one statement rebuilds in place
  schema: orders
  sql: alter table `orders` drop primary key, add primary key (`id`, `user_id`)
  expect:
    - { rule: drop-primary-key, algorithm: INPLACE, lock: NONE, rebuild: true, severity: warn }
    - { rule: add-primary-key, algorithm: INPLACE, lock: NONE, rebuild: true, severity: warn }
  statement: { algorithm: INPLACE, lock: NONE, rebuild: true }
