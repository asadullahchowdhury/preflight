# Version-specific behaviour. The oracle suite only checks these against whatever server it runs on
# (re-analysing for that server's version), so these expectations come from the MySQL 8.0/8.4 docs.

- name: 8.0.11 has no instant add column
  server: 8.0.11
  schema: orders
  sql: alter table `orders` add `notes` varchar(255) null
  expect:
    - { rule: add-column, algorithm: INPLACE, lock: NONE, rebuild: true, severity: warn }

- name: 8.0.11 default change is in place metadata
  server: 8.0.11
  schema: orders
  sql: alter table `orders` alter column `status` set default 'x'
  expect:
    - { rule: alter-column, algorithm: INPLACE, lock: NONE, rebuild: false, severity: info }

- name: 8.0.20 adds columns instantly only at the end
  server: 8.0.20
  schema: orders
  sql: alter table `orders` add `notes` varchar(255) null
  expect:
    - { rule: add-column, algorithm: INSTANT, severity: info }

- name: 8.0.20 add column after rebuilds
  server: 8.0.20
  schema: orders
  sql: alter table `orders` add `notes` varchar(255) null after `id`
  expect:
    - { rule: add-column, algorithm: INPLACE, lock: NONE, rebuild: true, severity: warn }

- name: 8.0.28 drop column rebuilds
  server: 8.0.28
  schema: orders
  sql: alter table `orders` drop `note`
  expect:
    - { rule: drop-column, algorithm: INPLACE, lock: NONE, rebuild: true, severity: warn }

- name: 8.0.27 rename column is in place metadata
  server: 8.0.27
  schema: orders
  sql: alter table `orders` rename column `note` to `remark`
  expect:
    - { rule: rename-column, algorithm: INPLACE, lock: NONE, rebuild: false, severity: warn }

- name: 8.0.28 rename column is instant
  server: 8.0.28
  schema: orders
  sql: alter table `orders` rename column `note` to `remark`
  expect:
    - { rule: rename-column, algorithm: INSTANT, severity: warn }

- name: 8.4 LTS adds columns instantly at any position
  server: 8.4.3
  schema: orders
  sql: alter table `orders` add `notes` varchar(255) null first
  expect:
    - { rule: add-column, algorithm: INSTANT, severity: info }

- name: 8.4 LTS drops columns instantly
  server: 8.4.3
  schema: orders
  sql: alter table `orders` drop `note`
  expect:
    - { rule: drop-column, algorithm: INSTANT, severity: warn }

# Verified on MySQL 8.0.12 (oracle matrix): CHECK constraints are parsed but ignored before 8.0.16.
- name: before 8.0.16 a check constraint is ignored, so it is instant
  server: 8.0.12
  schema: orders
  sql: alter table `orders` add constraint `orders_qty_check` check (`qty` >= 0)
  expect:
    - { rule: add-check, algorithm: INSTANT, lock: NONE, rebuild: false, severity: info }

- name: check constraints copy the table once they are enforced (8.0.16)
  server: 8.0.16
  schema: orders
  sql: alter table `orders` add constraint `orders_qty_check` check (`qty` >= 0)
  expect:
    - { rule: add-check, algorithm: COPY, severity: danger }

# Verified on MySQL 8.0.12 (COPY) and 8.0.27 (in place); versions in between are treated as COPY.
- name: before 8.0.27 changing the collation of a non-indexed column copies the table
  server: 8.0.12
  schema: orders
  sql: alter table `orders` modify `note` varchar(100) collate utf8mb4_bin null comment 'c'
  expect:
    - { rule: modify-column, algorithm: COPY, lock: SHARED, rebuild: true, severity: danger }

- name: from 8.0.27 changing the collation of a non-indexed column is in place
  server: 8.0.27
  schema: orders
  sql: alter table `orders` modify `note` varchar(100) collate utf8mb4_bin null comment 'c'
  expect:
    - { rule: modify-column, algorithm: INPLACE, lock: NONE, rebuild: false, severity: info }
